<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dazhi Bridge Shutter Chance</title>
    <link rel="icon" href="./favicon-snapshot.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
    <script defer src="./app.js"></script>
</head>

<body>
    <main class="shell">
        <header class="topbar">
            <div>
                <h1 data-i18n="title">Dazhi Bridge Shutter Chance</h1>
                <div id="collection-status" class="collection-status" data-state="waiting" aria-live="polite">
                    <span class="status-dot" aria-hidden="true"></span>
                    <div>
                        <p id="collection-status-title">--</p>
                        <p id="collection-status-detail">--</p>
                    </div>
                </div>
            </div>
            <div class="header-actions">
                <button id="theme" class="header-button" type="button" aria-label="Switch to dark mode">
                    Dark
                </button>
                <button id="language" class="header-button" type="button" aria-label="Switch language">
                    EN
                </button>
                <a id="github-star" class="header-button github-star"
                    href="https://github.com/yanagiragi/dazhi-bridge-shutter-chance" target="_blank"
                    rel="noopener noreferrer" aria-label="Star this project on GitHub"
                    title="Star this project on GitHub" hidden>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <path
                            d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3.28-.36 6.72-1.61 6.72-7A5.4 5.4 0 0 0 19.22 4 5.3 5.3 0 0 0 19.13.5S17.95.14 15 1.82a13.4 13.4 0 0 0-7 0C5.05.14 3.87.5 3.87.5A5.3 5.3 0 0 0 3.78 4a5.4 5.4 0 0 0-1.5 3.5c0 5.42 3.44 6.61 6.72 7A4.8 4.8 0 0 0 8 18v4" />
                        <path d="M9 18c-4.51 2-5-2-7-2" />
                    </svg>
                </a>
            </div>
        </header>

        <section id="recommendation" class="recommendation" aria-live="polite">
            <div>
                <p class="eyebrow" data-i18n="recommendation">
                    Recommendation
                </p>
                <h2 id="recommendation-title">--</h2>
                <p id="recommendation-reason">--</p>
            </div>
        </section>

        <section class="card">
            <h2 data-i18n="today">Today</h2>
            <div class="stats">
                <div>
                    <span data-i18n="westbound">Westbound</span>
                    <strong id="westbound">--</strong>
                </div>
                <div>
                    <span data-i18n="eastbound">Eastbound</span>
                    <strong id="eastbound">--</strong>
                </div>
                <div>
                    <span data-i18n="unknown">Unknown</span>
                    <strong id="unknown">--</strong>
                </div>
            </div>
        </section>

        <section class="card">
            <h2 data-i18n="recent">Recent departures</h2>
            <div id="departures" class="departures">
                <p class="muted" data-i18n="loading">Loading...</p>
            </div>
        </section>

        <section class="card history-card">
            <div class="card-heading">
                <h2 data-i18n="history.title">Historical statistics</h2>
                <div class="segmented-control" data-i18n-aria-label="history.rangeLabel" aria-label="Statistics period">
                    <button type="button" data-statistics-range="7" data-i18n="history.range7">7 days</button>
                    <button type="button" data-statistics-range="30" data-i18n="history.range30">30 days</button>
                    <button type="button" data-statistics-range="all" data-i18n="history.rangeAll">All</button>
                </div>
            </div>
            <div class="history-summary">
                <div>
                    <span data-i18n="history.westboundShare">Westbound share</span>
                    <strong id="history-westbound-share">--</strong>
                </div>
                <div>
                    <span data-i18n="history.opportunityDays">Opportunity days</span>
                    <strong id="history-opportunity-days">--</strong>
                </div>
            </div>
            <p id="history-period" class="muted history-period">--</p>
            <div class="segmented-control history-view" data-i18n-aria-label="history.viewLabel"
                aria-label="Statistics view">
                <button type="button" data-statistics-view="daily" data-i18n="history.daily">Daily</button>
                <button type="button" data-statistics-view="hourly" data-i18n="history.hourly">Time of day</button>
            </div>
            <div class="history-legend">
                <span><i class="westbound"></i><span data-i18n="westbound">Westbound</span></span>
                <span><i class="eastbound"></i><span data-i18n="eastbound">Eastbound</span></span>
                <span><i class="unknown"></i><span data-i18n="unknown">Unknown</span></span>
            </div>
            <div id="history-chart" class="history-chart">
                <p class="muted" data-i18n="loading">Loading...</p>
            </div>
        </section>

        <footer>
            <span id="adsb-fi-attribution" hidden>
                <span data-i18n="source">Source</span>:
                <a href="https://adsb.fi/">adsb.fi</a>
                |
            </span>
            <span id="data-source">--</span> ·
            <span data-i18n="lastUpdated">Last updated</span>
            <span id="footer-updated">--</span>
        </footer>
    </main>
</body>

</html>

name: dazhi-bridge-shutter-chance
services:
  app:
    build: .
    init: true
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATABASE_PATH: /data/dazhi.sqlite
      TZ: ${TZ:-Asia/Taipei}
      WEB_ENABLED: ${WEB_ENABLED:-true}
      API_ENABLED: ${API_ENABLED:-true}
      API_BEARER_TOKEN: ${API_BEARER_TOKEN:-}
      AIRCRAFT_DATA_PROVIDER: ${AIRCRAFT_DATA_PROVIDER:-adsbfi}
      COLLECTOR_INTERVAL_MS: ${COLLECTOR_INTERVAL_MS:-30000}
      COLLECTOR_ACTIVE_TIME_ZONE: ${COLLECTOR_ACTIVE_TIME_ZONE:-Asia/Taipei}
      COLLECTOR_ACTIVE_START: ${COLLECTOR_ACTIVE_START:-06:30}
      COLLECTOR_ACTIVE_END: ${COLLECTOR_ACTIVE_END:-21:00}
      OBSERVATION_RETENTION_DAYS: ${OBSERVATION_RETENTION_DAYS:-7}
      OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID:-}
      OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET:-}
      OPENSKY_LAMIN: ${OPENSKY_LAMIN:-25.06}
      OPENSKY_LAMAX: ${OPENSKY_LAMAX:-25.08}
      OPENSKY_LOMIN: ${OPENSKY_LOMIN:-121.54}
      OPENSKY_LOMAX: ${OPENSKY_LOMAX:-121.57}
      ADSB_FI_LATITUDE: ${ADSB_FI_LATITUDE:-25.07}
      ADSB_FI_LONGITUDE: ${ADSB_FI_LONGITUDE:-121.555}
      ADSB_FI_DISTANCE_NM: ${ADSB_FI_DISTANCE_NM:-5}
    volumes:
      - dazhi-data:/data
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/healthz') .then(response => process.exit(response.ok ? 0 : 1)) .catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  dazhi-data:
